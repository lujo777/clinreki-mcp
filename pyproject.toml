[project]
name = "clinreki-mcp"
version = "0.1.0"
description = "MCP-сервер для клинических рекомендаций Минздрава РФ (cr.minzdrav.gov.ru)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "clinreki-mcp contributors" }]
keywords = ["mcp", "clinical-recommendations", "minzdrav", "healthcare"]
dependencies = [
    "mcp[cli]>=1.27",
    "httpx>=0.27",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
clinreki-mcp = "clinreki_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinreki_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: обращается к реальному API Минздрава (по умолчанию отключён)"]
addopts = "-m 'not live'"
testpaths = ["tests"]
